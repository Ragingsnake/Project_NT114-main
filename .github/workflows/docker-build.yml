name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'zkp_node/**'
      - 'blockchain/**'
      - 'shared/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      build_client:
        description: 'Force Build Client'
        type: boolean
        default: false
      build_server:
        description: 'Force Build Server'
        type: boolean
        default: false
      build_zkp_node:
        description: 'Force Build ZKP Node'
        type: boolean
        default: false
      build_blockchain:
        description: 'Force Build Blockchain'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'shared/**'
              - 'data_new/**'
              - 'docker/Dockerfile.client'
              - 'requirements.txt'
            server:
              - 'server/**'
              - 'shared/**'
              - 'data_new/**'
              - 'docker/Dockerfile.server'
              - 'requirements.txt'
            zkp_node:
              - 'zkp_node/**'
              - 'shared/**'
              - 'docker/Dockerfile.zkp_node'
              - 'requirements.txt'
            blockchain:
              - 'blockchain/**'
              - 'docker/Dockerfile.blockchain'
              - 'requirements.txt'

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ZKP Node
        if: steps.filter.outputs.zkp_node == 'true' || github.event.inputs.build_zkp_node == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.zkp_node
          push: true
          tags: ragingsnake/fl-zkp-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client
        if: steps.filter.outputs.client == 'true' || github.event.inputs.build_client == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          push: true
          tags: ragingsnake/fl-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Server
        if: steps.filter.outputs.server == 'true' || github.event.inputs.build_server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ragingsnake/fl-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js
        if: steps.filter.outputs.blockchain == 'true' || github.event.inputs.build_blockchain == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compile Truffle Contracts
        if: steps.filter.outputs.blockchain == 'true' || github.event.inputs.build_blockchain == 'true'
        run: |
          cd blockchain
          npm install
          npx truffle compile

      - name: Build and push Blockchain
        if: steps.filter.outputs.blockchain == 'true' || github.event.inputs.build_blockchain == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.blockchain
          push: true
          tags: ragingsnake/fl-blockchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
