apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-zkp-node
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fl-zkp-node
  template:
    metadata:
      labels:
        app: fl-zkp-node
    spec:
      containers:
        - name: fl-zkp-node
          image: {{ .Values.images.zkpNode }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: fl-zkp-node
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: fl-zkp-node
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
