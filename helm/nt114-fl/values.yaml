namespace: nt114-fl

images:
  server: docker.io/ragingsnake/fl-server:latest
  client: docker.io/ragingsnake/fl-client:latest
  blockchain: docker.io/ragingsnake/fl-blockchain:latest
  zkpNode: docker.io/ragingsnake/fl-zkp-node:latest
  pullPolicy: Always

ganache:
  image: trufflesuite/ganache:v7.9.2
  chainId: "1337"
  mnemonic: "test test test test test test test test test test test junk"

ipfs:
  image: ipfs/kubo:v0.32.1

storage:
  className: azurefile-csi
  resultsSize: 10Gi
  ipfsUsePvc: false

fl:
  serverPort: 8080
  clientCount: 5
  splitType: non_iid
  faultyClients: "0"

contract:
  addressFile: "/results/reputation-address.json"
  artifact: "/app/blockchain/build/contracts/Reputation.json"

attackMode: "normal"
malicious: "false"
rounds: 25

plot:
  enabled: false
  mode: non_iid

resultsViewer:
  enabled: false
