services:
  ganache:
    image: trufflesuite/ganache:v7.9.2
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "7545"
      - "--chain.chainId"
      - "1337"
      - "--wallet.mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      - "7545:7545"

  ipfs:
    image: ipfs/kubo:v0.32.1
    command: ["daemon", "--migrate=true"]
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "5001:5001"
      - "8085:8080"
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-export:/export

  fl-zkp-node:
    image: ragingsnake/fl-zkp-node:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      PORT: "8081"
    ports:
      - "8081:8081"

  contract-init:
    image: ragingsnake/fl-blockchain:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      WEB3_PROVIDER_URI: http://ganache:7545
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      CONTRACT_ARTIFACT: /app/blockchain/build/contracts/Reputation.json
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - ganache
    restart: "no"

  fl-server:
    image: ragingsnake/fl-server:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      FAULTY_CLIENTS: "${FAULTY_CLIENTS:-}"
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
    volumes:
      - shared-runtime:/app/runtime
      - ./output/history:/app/history
      - ./output/plots:/app/plots
    ports:
      - "8080:8080"
    depends_on:
      contract-init:
        condition: service_completed_successfully
      ipfs:
        condition: service_started
      fl-zkp-node:
        condition: service_started

  client-1:
    image: ragingsnake/fl-client:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      CLIENT_ID: "1"
      SPLIT_TYPE: non_iid
      SERVER_ADDRESS: fl-server:8080
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - fl-server

  client-2:
    image: ragingsnake/fl-client:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      CLIENT_ID: "2"
      SPLIT_TYPE: non_iid
      SERVER_ADDRESS: fl-server:8080
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - fl-server

  client-3:
    image: ragingsnake/fl-client:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      CLIENT_ID: "3"
      SPLIT_TYPE: non_iid
      SERVER_ADDRESS: fl-server:8080
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - fl-server

  client-4:
    image: ragingsnake/fl-client:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      CLIENT_ID: "4"
      SPLIT_TYPE: non_iid
      SERVER_ADDRESS: fl-server:8080
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
      MALICIOUS: "${MALICIOUS:-false}"
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - fl-server

  client-5:
    image: ragingsnake/fl-client:latest
    environment:
      NO_PROXY: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      no_proxy: "ganache,ipfs,fl-server,fl-zkp-node,contract-init,localhost,127.0.0.1"
      CLIENT_ID: "5"
      SPLIT_TYPE: non_iid
      SERVER_ADDRESS: fl-server:8080
      WEB3_PROVIDER_URI: http://ganache:7545
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001/http
      CONTRACT_ADDRESS_FILE: /app/runtime/reputation-address.json
      ZKP_NODE_URL: http://fl-zkp-node:8081
      MALICIOUS: "${MALICIOUS:-false}"
      ATTACK_MODE: "${ATTACK_MODE:-zkp_block}"
    volumes:
      - shared-runtime:/app/runtime
    depends_on:
      - fl-server

volumes:
  ipfs-data:
  ipfs-export:
  shared-runtime:
