name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ZKP Node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.zkp_node
          push: true
          tags: ragingsnake/fl-zkp-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          push: true
          tags: ragingsnake/fl-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ragingsnake/fl-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compile Truffle Contracts
        run: |
          cd blockchain
          npm install
          npx truffle compile

      - name: Build and push Blockchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.blockchain
          push: true
          tags: ragingsnake/fl-blockchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
